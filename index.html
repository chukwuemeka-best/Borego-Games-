<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Borego Football Online</title><link rel="stylesheet" href="style.css"></head><body><div id="game"><div id="hud"><div class="score"><span>BOREGO FC</span><b><i id="hs">0</i> : <i id="as">0</i></b><span>RIVALS</span></div><div class="clock"><span id="time">00:00</span> · <span id="net">OFFLINE</span> · <button id="sound" aria-label="Toggle sound">SOUND ON</button></div></div><div id="notice"></div><section id="lobby" class="panel"><h1>BOREGO <em>FOOTBALL</em></h1><p>ONLINE 3D FOOTBALL</p><button id="create">CREATE ONLINE MATCH</button><div class="join"><input id="codeInput" maxlength="8" placeholder="MATCH CODE"><button id="join">JOIN</button></div><div id="share" class="hidden"><small>YOUR MATCH CODE</small><strong id="code"></strong><button id="copy">COPY CODE</button><p>Send this code to the other player in your Borego chat.</p></div><small id="status">Both players need internet.</small></section><section id="end" class="panel hidden"><h1>FULL TIME</h1><h2 id="final"></h2><button onclick="location.reload()">BACK TO LOBBY</button></section><div id="controls"><div id="stick"><div id="knob"></div></div><div class="actions"><button id="switch">SWITCH</button><button id="pass">PASS</button><button id="lob">LOB</button><button id="shoot">SHOOT</button><button id="tackle">TACKLE</button><button id="sprint">SPRINT</button></div></div><div id="loading">LOADING 3D PITCH…</div></div><script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="game.js"></script></body></html>
